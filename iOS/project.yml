name: WatermarkCamera
options:
  bundleIdPrefix: com.watermark
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_PREVIEWS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  WatermarkCamera:
    type: application
    platform: iOS
    sources:
      - path: WatermarkCamera
    info:
      path: WatermarkCamera/Info.plist
      properties:
        CFBundleDisplayName: 水印相机
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 摄像头：拍摄商品照片并叠加水印
        NSCameraUsageDescription: 用于拍摄商品照片并叠加双语水印
        # 相册读取：从相册选择图片编辑水印
        NSPhotoLibraryUsageDescription: 用于从相册选择照片制作水印
        # 相册写入：将带水印的照片保存到系统相册
        NSPhotoLibraryAddUsageDescription: 用于将带水印的照片保存到系统相册
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watermark.camera
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor